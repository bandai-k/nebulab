<svg viewBox="0 0 260 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="萬代農園 BANDAI FARM">
  <!-- シンボル: 円 + 朝日 + 平らな畑の畝 -->
  <g transform="translate(28, 28)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#C68B5A" stroke-width="1.2"/>
    <!-- 朝日(地平線から覗く位置) -->
    <circle cx="0" cy="-3" r="6" fill="#C68B5A"/>
    <!-- 畑の畝(遠近を意識した 3 本の水平線) -->
    <line x1="-15" y1="6" x2="15" y2="6" stroke="#3F5734" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-14" y1="10" x2="14" y2="10" stroke="#3F5734" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <line x1="-13" y1="14" x2="13" y2="14" stroke="#3F5734" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- テキスト -->
  <g transform="translate(62, 28)">
    <text x="0" y="-2"
          font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'MS Mincho', serif"
          font-size="20" fill="#2D2620" font-weight="500" letter-spacing="3">萬代農園</text>
    <text x="0" y="18"
          font-family="'SF Mono', 'Menlo', 'Consolas', monospace"
          font-size="7.5" fill="#6B5F52" letter-spacing="2.4">BANDAI FARM · NARITA</text>
  </g>
</svg>
