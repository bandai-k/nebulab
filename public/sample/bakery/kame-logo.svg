  <path d="M16 47 C 16 41, 48 41, 48 47 Z" fill="#8B4A22"/>
  <!-- 甲羅の模様(クリーム色の水玉) -->
  <circle cx="32" cy="29" r="4.2" fill="#FBEAD0"/>
  <circle cx="23" cy="39" r="3" fill="#FBEAD0"/>
  <circle cx="41" cy="39" r="3" fill="#FBEAD0"/>
  <!-- 頭 -->
  <circle cx="54" cy="39" r="9" fill="#CE8A57"/>
  <!-- ほっぺ -->
  <circle cx="51" cy="41.5" r="2.3" fill="#E8AFAF"/>
  <!-- 目 -->
  <circle cx="56.5" cy="36.5" r="1.9" fill="#3D2E20"/>
  <circle cx="57.2" cy="35.8" r="0.6" fill="#FFFFFF"/>
  <!-- 口(にっこり) -->
  <path d="M52.5 41 q2.8 2.4 5.6 0" fill="none" stroke="#3D2E20" stroke-width="1.4" stroke-linecap="round"/>
  <!-- コック帽 -->
  <g transform="translate(-2.5, 4.5)">
    <circle cx="48.5" cy="20" r="5" fill="#FFFDF7"/>
    <circle cx="60" cy="20" r="5" fill="#FFFDF7"/>
    <circle cx="54" cy="16" r="6.5" fill="#FFFDF7"/>
    <rect x="46" y="23" width="16" height="7" rx="2.4" fill="#FFFDF7"/>
    <rect x="46" y="27.4" width="16" height="2.6" rx="1.3" fill="#EFE4CF"/>
