<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 60" role="img" aria-label="kitchen KAME ロゴ">
  <!-- 後ろ足・前足 -->
  <ellipse cx="25" cy="49" rx="6" ry="4.6" fill="#CE8A57"/>
  <ellipse cx="43" cy="49" rx="6" ry="4.6" fill="#CE8A57"/>
  <!-- しっぽ -->
  <path d="M17 43 q-6 1 -8 5 q5 0 9 -2 z" fill="#CE8A57"/>
  <!-- 甲羅 -->
  <path d="M16 47 C 16 16, 48 16, 48 47 Z" fill="#A1542A"/>
