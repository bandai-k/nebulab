<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Nebulab サービス群">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2EDDF"/>
      <stop offset="100%" stop-color="#E8E5DD"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="240" fill="url(#bg)"/>

  <!-- 上下の装飾線(細・水平) -->
  <g stroke="#C75D3C" stroke-width="0.7" opacity="0.55">
    <line x1="60" y1="40" x2="200" y2="40"/>
    <line x1="600" y1="40" x2="740" y2="40"/>
    <line x1="60" y1="200" x2="200" y2="200"/>
    <line x1="600" y1="200" x2="740" y2="200"/>
  </g>

  <!-- 中央のアイコン円群 -->
  <g>
    <!-- 主要 = モニター(中央) -->
    <g transform="translate(400, 120)">
      <circle cx="0" cy="0" r="50" fill="#FAFAF8" stroke="#1A1A18" stroke-width="1"/>
      <g stroke="#C75D3C" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-22" y="-18" width="44" height="28" rx="1.5"/>
        <path d="M-9 11v5M9 11v5M-13 16h26"/>
        <path d="M-17 -10h34" stroke-opacity="0.4"/>
      </g>
    </g>

    <!-- 左サイド: cart -->
    <g transform="translate(265, 100)">
      <circle cx="0" cy="0" r="32" fill="#FAFAF8" stroke="#D0CDC4" stroke-width="0.8"/>
      <g stroke="#6A6A68" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-14 -8h3.5l2.5 14.5a2 2 0 0 0 2 1.7h11a2 2 0 0 0 2-1.7L9 -4.5h-17"/>
        <circle cx="-5" cy="9" r="1.6"/>
        <circle cx="6" cy="9" r="1.6"/>
      </g>
    </g>

    <!-- 右サイド: chat -->
    <g transform="translate(535, 100)">
      <circle cx="0" cy="0" r="32" fill="#FAFAF8" stroke="#D0CDC4" stroke-width="0.8"/>
      <g stroke="#6A6A68" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-14 -10h26a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H-2L-14 12V-10z"/>
        <circle cx="-7" cy="-1" r="1" fill="#6A6A68"/>
        <circle cx="0" cy="-1" r="1" fill="#6A6A68"/>
        <circle cx="7" cy="-1" r="1" fill="#6A6A68"/>
      </g>
    </g>

    <!-- 下左: gear -->
    <g transform="translate(220, 170)">
      <circle cx="0" cy="0" r="22" fill="#FAFAF8" stroke="#D0CDC4" stroke-width="0.7"/>
      <g stroke="#6A6A68" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="0" cy="0" r="3.8"/>
        <path d="M0 -10v3M0 7v3M-7 -7l2 2M5 5l2 2M-10 0h3M7 0h3M-7 7l2-2M5 -5l2-2"/>
      </g>
    </g>

    <!-- 下中左: map-pin -->
    <g transform="translate(335, 175)">
      <circle cx="0" cy="0" r="20" fill="#FAFAF8" stroke="#D0CDC4" stroke-width="0.7"/>
      <g stroke="#6A6A68" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -10c-3.6 0-6.5 2.9-6.5 6.5 0 4.8 6.5 11 6.5 11s6.5-6.2 6.5-11C6.5-7.1 3.6-10 0-10z"/>
        <circle cx="0" cy="-3.5" r="2.3"/>
      </g>
    </g>

    <!-- 下中右: sparkle -->
    <g transform="translate(465, 175)">
      <circle cx="0" cy="0" r="20" fill="#FAFAF8" stroke="#D0CDC4" stroke-width="0.7"/>
      <g stroke="#6A6A68" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -10v3M0 7v3M-10 0h3M7 0h3M-7 -7l2 2M5 5l2 2M-7 7l2-2M5 -5l2-2"/>
        <circle cx="0" cy="0" r="2.5" fill="#6A6A68" fill-opacity="0.2"/>
      </g>
    </g>

    <!-- 下右: calendar -->
    <g transform="translate(580, 170)">
      <circle cx="0" cy="0" r="22" fill="#FAFAF8" stroke="#D0CDC4" stroke-width="0.7"/>
      <g stroke="#6A6A68" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-8" y="-6" width="16" height="13" rx="1"/>
        <path d="M-8 -2h16M-4 -9v3M4 -9v3"/>
        <circle cx="0" cy="2" r="0.8" fill="#6A6A68"/>
        <circle cx="4" cy="2" r="0.8" fill="#6A6A68"/>
        <circle cx="-4" cy="2" r="0.8" fill="#6A6A68"/>
      </g>
    </g>
  </g>

  <!-- mono ラベル(両端) -->
  <text x="60" y="220" font-family="'SF Mono', monospace" font-size="9" fill="#6A6A68" letter-spacing="1.5">— BUSINESS SUPPORT MENU —</text>
  <text x="740" y="220" text-anchor="end" font-family="'SF Mono', monospace" font-size="9" fill="#6A6A68" letter-spacing="1.5">NARITA · NEBULAB</text>
</svg>
